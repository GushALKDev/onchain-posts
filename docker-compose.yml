# Local stack: Postgres (database and job queue) and the backend (API + workers in one process, ADR-016).
# The web app will be added in Tier 3. Copy .env.example to .env and fill it in first.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1"]
      interval: 2s
      retries: 30

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    restart: unless-stopped
    # Only the backend's own variables: never the deployer key or the VITE_* web settings (least privilege).
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # The KMS simulator keystore lives in a volume, outside the database (ADR-016). Never commit it.
      KMS_SIMULATOR_KEYSTORE_PATH: /data/keystore.json
      PORT: ${PORT:-8080}
      WEB_ORIGINS: ${WEB_ORIGINS:-}
      STORAGE_MODE: ${STORAGE_MODE:-turbo}
      DB_HMAC_SECRET: ${DB_HMAC_SECRET:?set DB_HMAC_SECRET in .env}
      SIGNER_MODE: ${SIGNER_MODE:-simulator}
      RELAYER_SIGNER_KEY_REF: ${RELAYER_SIGNER_KEY_REF:-relayer}
      RECEIPT_SIGNER_KEY_REF: ${RECEIPT_SIGNER_KEY_REF:-receipt}
      ARWEAVE_SIGNER_KEY_REF: ${ARWEAVE_SIGNER_KEY_REF:-arweave}
      SIGNATURE_ENCRYPTION_KEY_REF: ${SIGNATURE_ENCRYPTION_KEY_REF:-signature-encryption}
      ETHEREUM_SEPOLIA_RPC_URL: ${ETHEREUM_SEPOLIA_RPC_URL:-}
      BASE_SEPOLIA_RPC_URL: ${BASE_SEPOLIA_RPC_URL:-}
      ARBITRUM_SEPOLIA_RPC_URL: ${ARBITRUM_SEPOLIA_RPC_URL:-}
      TMAX_SECONDS_ETHEREUM_SEPOLIA: ${TMAX_SECONDS_ETHEREUM_SEPOLIA:-}
      TMAX_SECONDS_BASE_SEPOLIA: ${TMAX_SECONDS_BASE_SEPOLIA:-}
      TMAX_SECONDS_ARBITRUM_SEPOLIA: ${TMAX_SECONDS_ARBITRUM_SEPOLIA:-}
      NMAX_ETHEREUM_SEPOLIA: ${NMAX_ETHEREUM_SEPOLIA:-}
      NMAX_BASE_SEPOLIA: ${NMAX_BASE_SEPOLIA:-}
      NMAX_ARBITRUM_SEPOLIA: ${NMAX_ARBITRUM_SEPOLIA:-}
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_TMAX_SECONDS: ${DEMO_TMAX_SECONDS:-}
      DEMO_FLUSH_TOKEN: ${DEMO_FLUSH_TOKEN:-}
    # Loopback only: behind a reverse proxy (Dokploy's Traefik) the proxy reaches the container over the Docker network.
    ports:
      - "127.0.0.1:${PORT:-8080}:${PORT:-8080}"
    volumes:
      - keystore:/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  keystore:
