# Local stack: Postgres (database and job queue) and the backend (API + workers in one process, ADR-016).
# The web app will be added in Tier 3. Copy .env.example to .env and fill it in first.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1"]
      interval: 2s
      retries: 30

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # The KMS simulator keystore lives in a volume, outside the database (ADR-016). Never commit it.
      KMS_SIMULATOR_KEYSTORE_PATH: /data/keystore.json
    ports:
      - "8080:8080"
    volumes:
      - keystore:/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  keystore:
